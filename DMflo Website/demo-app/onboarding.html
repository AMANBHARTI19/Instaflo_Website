<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>DMflo · Get started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Schibsted+Grotesk:wght@400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="calm.css">
<style>
  /* Opt out of mobile-browser auto/forced dark mode — onboarding is light-only */
  :root { color-scheme: only light; }

  /* ---- Mobile browser: single-column, scrollable, sticky CTA ---- */
  @media (max-width: 820px) {
    html, body { overflow: auto; height: auto; min-height: 100%; }
    #root { height: auto; min-height: 100%; }

    .onb { display: block; height: auto; min-height: 100dvh; }
    .onb-right { display: none; }              /* decorative panel is desktop-only */

    .onb-left {
      overflow: visible;
      justify-content: flex-start;
      align-items: center;
      min-height: 100dvh;
      padding: 28px 20px calc(104px + env(safe-area-inset-bottom));
    }
    .onb-left > * { max-width: 460px; }
    .onb-left > div:first-child { margin-bottom: 24px !important; }  /* logo */

    .onb-q  { font-size: clamp(27px, 8vw, 34px); }
    .onb-sub { font-size: 15px; margin-bottom: 22px; }

    /* Sticky bottom action bar */
    .onb-actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      max-width: none; margin-top: 0; gap: 12px;
      padding: 13px 20px calc(13px + env(safe-area-inset-bottom));
      background: color-mix(in oklch, var(--surface) 90%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
    }
    .onb-actions > div { display: none; }       /* the flex spacer */
    .onb-actions .btn-primary { flex: 1; justify-content: center; padding: 14px 22px !important; }
    .onb-actions .btn-ghost { padding: 14px 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="OnboardingScreen.jsx"></script>
<script type="text/babel">
  function OnbApp() {
    return <OnboardingScreen onDone={() => { window.location.href = "index.html"; }} />;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<OnbApp />);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="oklch(0.982 0.004 95)"/>
    <circle cx="50" cy="38" r="14" fill="none" stroke="oklch(0.86 0.16 126)" stroke-width="5"/>
    <rect x="30" y="62" width="40" height="5" rx="2.5" fill="oklch(0.78 0.004 80)"/>
    <rect x="38" y="73" width="24" height="5" rx="2.5" fill="oklch(0.86 0.16 126)"/>
  </svg>
</template>
</body>
</html>
