<style>
  /* Mobile-browser block — dashboard isn't built for small screens */
  .mblock {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--paper);
  }
  .mblock-card {
    width: 100%; max-width: 360px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .mb-brand { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 28px; }
  .mb-brand .word { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  .mb-ico {
    width: 60px; height: 60px; border-radius: var(--r-lg);
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent-press); font-size: 28px;
    margin-bottom: 20px;
  }
  .mb-h { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.025em; line-height: 1.08; }
  .mb-p { font-size: 14.5px; color: var(--ink-2); margin-top: 10px; max-width: 30ch; }
  .mb-cta { margin-top: 26px; width: 100%; justify-content: center; font-size: 15px; padding: 13px 22px; }
  .mb-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .mb-actions .mb-cta { margin-top: 0; }
  .mb-actions { margin-top: 26px; }
  .mb-note { margin-top: 14px; }
</style>
</head>
